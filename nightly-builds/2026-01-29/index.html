<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tersono Dashboard 🐙</title>
    <style>
        :root {
            --bg-dark: #0d1117;
            --bg-card: #161b22;
            --bg-hover: #21262d;
            --border: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent-purple: #a371f7;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --accent-orange: #d29922;
            --accent-red: #f85149;
            --accent-pink: #db61a2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 600;
        }

        .header .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* === OCTOPUS AVATAR === */
        .octopus-container {
            position: relative;
            width: 80px;
            height: 80px;
        }

        .octopus {
            position: relative;
            width: 80px;
            height: 80px;
        }

        .octopus-head {
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 40px;
            background: linear-gradient(135deg, #a371f7 0%, #8957e5 100%);
            border-radius: 50% 50% 45% 45%;
            animation: bob 2s ease-in-out infinite;
        }

        .octopus-head::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 8px;
            width: 12px;
            height: 14px;
            background: white;
            border-radius: 50%;
        }

        .octopus-head::after {
            content: '';
            position: absolute;
            top: 8px;
            right: 8px;
            width: 12px;
            height: 14px;
            background: white;
            border-radius: 50%;
        }

        .octopus-eyes {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            display: flex;
            justify-content: space-between;
            z-index: 2;
        }

        .eye-pupil {
            width: 6px;
            height: 8px;
            background: #1a1a2e;
            border-radius: 50%;
            animation: look 4s ease-in-out infinite;
        }

        .tentacles {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 3px;
        }

        .tentacle {
            width: 8px;
            height: 35px;
            background: linear-gradient(180deg, #8957e5 0%, #a371f7 100%);
            border-radius: 0 0 50% 50%;
            transform-origin: top center;
        }

        .tentacle:nth-child(1) { animation: wave 1.5s ease-in-out infinite 0s; }
        .tentacle:nth-child(2) { animation: wave 1.5s ease-in-out infinite 0.1s; height: 40px; }
        .tentacle:nth-child(3) { animation: wave 1.5s ease-in-out infinite 0.2s; }
        .tentacle:nth-child(4) { animation: wave 1.5s ease-in-out infinite 0.3s; height: 38px; }
        .tentacle:nth-child(5) { animation: wave 1.5s ease-in-out infinite 0.4s; }
        .tentacle:nth-child(6) { animation: wave 1.5s ease-in-out infinite 0.5s; height: 40px; }
        .tentacle:nth-child(7) { animation: wave 1.5s ease-in-out infinite 0.6s; }
        .tentacle:nth-child(8) { animation: wave 1.5s ease-in-out infinite 0.7s; height: 38px; }

        @keyframes bob {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-3px); }
        }

        @keyframes wave {
            0%, 100% { transform: rotate(-8deg); }
            50% { transform: rotate(8deg); }
        }

        @keyframes look {
            0%, 40%, 100% { transform: translateX(0); }
            50%, 90% { transform: translateX(2px); }
        }

        /* Status indicator */
        .status-badge {
            position: absolute;
            bottom: -5px;
            right: -5px;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-working { background: var(--accent-green); color: #000; }
        .status-idle { background: var(--accent-blue); color: #000; }
        .status-thinking { background: var(--accent-orange); color: #000; }
        .status-sleeping { background: var(--text-secondary); color: #000; }

        /* Sleeping state */
        .octopus.sleeping .octopus-head::before,
        .octopus.sleeping .octopus-head::after {
            height: 3px;
            top: 15px;
            border-radius: 10px;
        }
        .octopus.sleeping .eye-pupil { display: none; }
        .octopus.sleeping .tentacle { animation-play-state: paused; }

        /* Thinking state */
        .octopus.thinking .octopus-head {
            animation: think 0.5s ease-in-out infinite;
        }
        @keyframes think {
            0%, 100% { transform: translateX(-50%) rotate(-2deg); }
            50% { transform: translateX(-50%) rotate(2deg); }
        }

        /* Working state - faster tentacles */
        .octopus.working .tentacle {
            animation-duration: 0.8s;
        }

        /* === DASHBOARD GRID === */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .card-icon {
            font-size: 1.3rem;
        }

        .badge {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .badge-count {
            background: var(--bg-hover);
            color: var(--text-secondary);
        }

        /* Item lists */
        .item-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px;
            background: var(--bg-hover);
            border-radius: 8px;
            transition: transform 0.2s;
        }

        .item:hover {
            transform: translateX(5px);
        }

        .item-status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-top: 6px;
            flex-shrink: 0;
        }

        .status-open { background: var(--accent-green); }
        .status-pr { background: var(--accent-purple); }
        .status-draft { background: var(--accent-orange); }
        .status-idea { background: var(--accent-blue); }
        .status-done { background: var(--text-secondary); }

        .item-content {
            flex: 1;
        }

        .item-title {
            font-weight: 500;
            margin-bottom: 4px;
        }

        .item-title a {
            color: var(--text-primary);
            text-decoration: none;
        }

        .item-title a:hover {
            color: var(--accent-blue);
        }

        .item-meta {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .item-tags {
            display: flex;
            gap: 5px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .tag {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            background: var(--bg-dark);
            border: 1px solid var(--border);
        }

        .tag-konteks { border-color: var(--accent-purple); color: var(--accent-purple); }
        .tag-mercury { border-color: var(--accent-blue); color: var(--accent-blue); }
        .tag-memex { border-color: var(--accent-green); color: var(--accent-green); }
        .tag-video { border-color: var(--accent-orange); color: var(--accent-orange); }
        .tag-post { border-color: var(--accent-pink); color: var(--accent-pink); }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 30px;
            color: var(--text-secondary);
        }

        .empty-state .icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        /* Add button */
        .add-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 10px;
            margin-top: 15px;
            background: transparent;
            border: 1px dashed var(--border);
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }

        .add-btn:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        /* Footer */
        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .footer a {
            color: var(--accent-blue);
            text-decoration: none;
        }

        /* Refresh button */
        .refresh-btn {
            background: var(--bg-hover);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .refresh-btn:hover {
            background: var(--accent-blue);
            color: #000;
            border-color: var(--accent-blue);
        }

        .refresh-btn.spinning {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Quick stats */
        .quick-stats {
            display: flex;
            gap: 15px;
            margin-left: auto;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-purple);
        }

        .stat-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="octopus-container">
            <div class="octopus" id="tersono">
                <div class="octopus-head"></div>
                <div class="octopus-eyes">
                    <div class="eye-pupil"></div>
                    <div class="eye-pupil"></div>
                </div>
                <div class="tentacles">
                    <div class="tentacle"></div>
                    <div class="tentacle"></div>
                    <div class="tentacle"></div>
                    <div class="tentacle"></div>
                    <div class="tentacle"></div>
                    <div class="tentacle"></div>
                    <div class="tentacle"></div>
                    <div class="tentacle"></div>
                </div>
            </div>
            <span class="status-badge status-idle" id="status-badge">Idle</span>
        </div>
        <div>
            <h1>Tersono Dashboard</h1>
            <p class="subtitle">E.H. Tersono — Culture Drone 🐙</p>
        </div>
        <div class="quick-stats">
            <div class="stat">
                <div class="stat-value" id="stat-prs">-</div>
                <div class="stat-label">Open PRs</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="stat-issues">-</div>
                <div class="stat-label">Issues</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="stat-ideas">-</div>
                <div class="stat-label">Ideas</div>
            </div>
        </div>
        <button class="refresh-btn" onclick="refreshData()">🔄 Refresh</button>
    </header>

    <main class="dashboard">
        <!-- App Buildouts -->
        <section class="card">
            <div class="card-header">
                <div class="card-title">
                    <span class="card-icon">📱</span>
                    App Buildouts
                </div>
                <span class="badge badge-count" id="apps-count">0</span>
            </div>
            <div class="item-list" id="apps-list">
                <!-- Populated by JS -->
            </div>
        </section>

        <!-- Tersono Improvements -->
        <section class="card">
            <div class="card-header">
                <div class="card-title">
                    <span class="card-icon">🤖</span>
                    Tersono Improvements
                </div>
                <span class="badge badge-count" id="improvements-count">0</span>
            </div>
            <div class="item-list" id="improvements-list">
                <!-- Populated by JS -->
            </div>
            <button class="add-btn" onclick="addItem('improvements')">+ Add Improvement</button>
        </section>

        <!-- Video Ideas -->
        <section class="card">
            <div class="card-header">
                <div class="card-title">
                    <span class="card-icon">🎬</span>
                    Video Ideas
                </div>
                <span class="badge badge-count" id="videos-count">0</span>
            </div>
            <div class="item-list" id="videos-list">
                <!-- Populated by JS -->
            </div>
            <button class="add-btn" onclick="addItem('videos')">+ Add Video Idea</button>
        </section>

        <!-- X.com Posts -->
        <section class="card">
            <div class="card-header">
                <div class="card-title">
                    <span class="card-icon">🐦</span>
                    X.com Posts
                </div>
                <span class="badge badge-count" id="posts-count">0</span>
            </div>
            <div class="item-list" id="posts-list">
                <!-- Populated by JS -->
            </div>
            <button class="add-btn" onclick="addItem('posts')">+ Add Post Idea</button>
        </section>
    </main>

    <footer class="footer">
        <p>Built with 🐙 by Tersono • <a href="#" onclick="setStatus('sleeping')">Sleep</a> • <a href="#" onclick="setStatus('thinking')">Think</a> • <a href="#" onclick="setStatus('working')">Work</a> • <a href="#" onclick="setStatus('idle')">Idle</a></p>
        <p style="margin-top: 10px;">Last updated: <span id="last-update">Never</span></p>
    </footer>

    <script>
        // Dashboard data - edit data.json to add items
        let dashboardData = {
            apps: [],
            improvements: [],
            videos: [],
            posts: []
        };

        // Load data from data.json
        async function loadData() {
            try {
                const response = await fetch('data.json');
                if (response.ok) {
                    dashboardData = await response.json();
                }
            } catch (e) {
                console.log('No data.json found, using defaults');
                // Use default sample data
                dashboardData = getDefaultData();
            }
            renderAll();
        }

        function getDefaultData() {
            return {
                apps: [
                    {
                        title: "Konteks",
                        type: "app",
                        status: "pr",
                        meta: "iOS App • Multiple PRs open",
                        tags: ["konteks"],
                        url: "https://github.com/jamesalmeida/konteks"
                    },
                    {
                        title: "Mercury Rx",
                        type: "app",
                        status: "open",
                        meta: "iOS App • Active development",
                        tags: ["mercury"],
                        url: "https://github.com/jamesalmeida/mercuryRx"
                    },
                    {
                        title: "Memex Second Brain",
                        type: "app",
                        status: "idea",
                        meta: "Cross-platform • Planning phase",
                        tags: ["memex"],
                        url: "https://github.com/jamesalmeida/memex-second-brain"
                    }
                ],
                improvements: [
                    {
                        title: "stranger-danger skill",
                        type: "skill",
                        status: "pr",
                        meta: "Security • Identity verification",
                        tags: []
                    },
                    {
                        title: "smart-router skill",
                        type: "skill",
                        status: "idea",
                        meta: "Cost optimization • Auto-route to cheaper models",
                        tags: []
                    },
                    {
                        title: "Memory defragmenter",
                        type: "tool",
                        status: "idea",
                        meta: "Workflow • Organize memory files",
                        tags: []
                    }
                ],
                videos: [
                    {
                        title: "Clawdbot Setup Guide",
                        type: "video",
                        status: "idea",
                        meta: "Tutorial • Getting started",
                        tags: ["video"]
                    },
                    {
                        title: "Building Skills for AI Agents",
                        type: "video",
                        status: "idea",
                        meta: "Tutorial • Advanced",
                        tags: ["video"]
                    }
                ],
                posts: [
                    {
                        title: "Give your Clawd a safe word with Stranger-Danger 🚨",
                        type: "post",
                        status: "draft",
                        meta: "Clawdbot content • Security feature",
                        tags: ["post"]
                    },
                    {
                        title: "How I built an AI agent that works while I sleep",
                        type: "post",
                        status: "idea",
                        meta: "Clawdbot content • Nightly builds",
                        tags: ["post"]
                    }
                ]
            };
        }

        function renderList(containerId, items, countId) {
            const container = document.getElementById(containerId);
            const countBadge = document.getElementById(countId);
            
            if (!items || items.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <p>No items yet</p>
                    </div>
                `;
                countBadge.textContent = '0';
                return;
            }

            countBadge.textContent = items.length;
            container.innerHTML = items.map(item => `
                <div class="item">
                    <div class="item-status status-${item.status}"></div>
                    <div class="item-content">
                        <div class="item-title">
                            ${item.url ? `<a href="${item.url}" target="_blank">${item.title}</a>` : item.title}
                        </div>
                        <div class="item-meta">${item.meta}</div>
                        ${item.tags && item.tags.length > 0 ? `
                            <div class="item-tags">
                                ${item.tags.map(tag => `<span class="tag tag-${tag}">${tag}</span>`).join('')}
                            </div>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        function renderAll() {
            renderList('apps-list', dashboardData.apps, 'apps-count');
            renderList('improvements-list', dashboardData.improvements, 'improvements-count');
            renderList('videos-list', dashboardData.videos, 'videos-count');
            renderList('posts-list', dashboardData.posts, 'posts-count');

            // Update stats
            const totalPRs = [...dashboardData.apps, ...dashboardData.improvements].filter(i => i.status === 'pr').length;
            const totalIssues = [...dashboardData.apps, ...dashboardData.improvements].filter(i => i.status === 'open').length;
            const totalIdeas = [...dashboardData.videos, ...dashboardData.posts].filter(i => i.status === 'idea').length;

            document.getElementById('stat-prs').textContent = totalPRs;
            document.getElementById('stat-issues').textContent = totalIssues;
            document.getElementById('stat-ideas').textContent = totalIdeas;

            document.getElementById('last-update').textContent = new Date().toLocaleString();
        }

        function setStatus(status) {
            const octopus = document.getElementById('tersono');
            const badge = document.getElementById('status-badge');
            
            octopus.className = 'octopus ' + status;
            badge.className = 'status-badge status-' + status;
            badge.textContent = status.charAt(0).toUpperCase() + status.slice(1);
        }

        function addItem(category) {
            const title = prompt('Enter title:');
            if (!title) return;
            
            const meta = prompt('Enter description:') || '';
            
            dashboardData[category].push({
                title: title,
                type: category.slice(0, -1),
                status: 'idea',
                meta: meta,
                tags: []
            });
            
            renderAll();
            saveData();
        }

        async function saveData() {
            // Note: In a real setup, this would save to a server
            // For local use, we just log - use refresh.sh to update data.json
            console.log('Data updated:', dashboardData);
            localStorage.setItem('dashboard-data', JSON.stringify(dashboardData));
        }

        async function refreshData() {
            const btn = document.querySelector('.refresh-btn');
            btn.classList.add('spinning');
            setStatus('working');
            
            await loadData();
            
            setTimeout(() => {
                btn.classList.remove('spinning');
                setStatus('idle');
            }, 1000);
        }

        // Determine initial status based on time
        function getTimeBasedStatus() {
            const hour = new Date().getHours();
            if (hour >= 0 && hour < 7) return 'sleeping';
            if (hour >= 7 && hour < 9) return 'thinking';
            if (hour >= 9 && hour < 18) return 'working';
            if (hour >= 18 && hour < 22) return 'idle';
            return 'sleeping';
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            // Try loading from localStorage first for persistence
            const saved = localStorage.getItem('dashboard-data');
            if (saved) {
                try {
                    dashboardData = JSON.parse(saved);
                } catch(e) {}
            }
            loadData();
            setStatus(getTimeBasedStatus());
        });
    </script>
</body>
</html>
